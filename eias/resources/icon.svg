<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- HIAS - Hall Invigilator Allocation System: an exam hall with a "confirmed" badge -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B5E3F"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#shine)"/>

  <!-- Hall (centred on x=222) -->
  <path d="M222 96 L360 166 L84 166 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round"/>
  <rect x="92" y="180" width="260" height="24" rx="6" fill="#FFFFFF"/>
  <rect x="112" y="216" width="34" height="132" rx="6" fill="#FFFFFF"/>
  <rect x="172" y="216" width="34" height="132" rx="6" fill="#FFFFFF"/>
  <rect x="238" y="216" width="34" height="132" rx="6" fill="#FFFFFF"/>
  <rect x="298" y="216" width="34" height="132" rx="6" fill="#FFFFFF"/>
  <rect x="96" y="358" width="252" height="24" rx="6" fill="#FFFFFF"/>
  <rect x="80" y="392" width="284" height="22" rx="6" fill="#DCFCE7"/>

  <!-- Confirmed badge -->
  <circle cx="376" cy="360" r="84" fill="#123B2A"/>
  <circle cx="376" cy="360" r="70" fill="#F59E0B"/>
  <path d="M341 362 L366 387 L413 338" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
