      <stop offset="0%" style="stop-color:#123B2A"/>
      <stop offset="100%" style="stop-color:#16A34A"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
