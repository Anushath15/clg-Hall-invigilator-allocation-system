  <line x1="128" y1="148" x2="128" y2="200" stroke="#16A34A" stroke-width="3"/>
  <!-- Lines on book -->
  <line x1="98" y1="164" x2="122" y2="164" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="98" y1="174" x2="122" y2="174" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="98" y1="184" x2="122" y2="184" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="134" y1="164" x2="158" y2="164" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="134" y1="174" x2="158" y2="174" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="134" y1="184" x2="158" y2="184" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
</svg>
